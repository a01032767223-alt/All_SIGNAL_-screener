name: 국내주식 스크리닝

on:
  schedule:
    # 평일 16:10 KST = 07:10 UTC (장 마감 후 KRX 데이터 확정 시점)
    - cron: "10 7 * * 1-5"
  workflow_dispatch:          # 수동 실행 버튼

concurrency:
  group: screen-kr
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      # OHLCV 캐시는 리포에 커밋하지 않고 Actions 캐시에 보관 (리포 용량 절약)
      - name: OHLCV 캐시 복원
        uses: actions/cache@v4
        with:
          path: cache
          key: kr-ohlcv-${{ github.run_id }}
          restore-keys: |
            kr-ohlcv-

      - name: 스크리닝 실행
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          PAGES_URL: ${{ vars.PAGES_URL }}
        run: python -m screener.run --market kr --notify

      - name: 결과 커밋
        run: |
          git config user.name "screener-bot"
          git config user.email "actions@github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "국내주식 스크리닝 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
            for i in 1 2 3; do
              git pull --rebase --autostash origin ${{ github.ref_name }} && \
              git push && break || sleep 5
            done
          fi
