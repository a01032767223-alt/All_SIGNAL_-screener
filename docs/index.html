<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- GitHub Pages는 응답 헤더를 넣을 수 없어 meta로 겁니다.
     외부 스크립트 로드와 다른 출처로의 통신·이미지 요청을 전부 막아,
     혹시 이스케이프가 뚫리더라도 데이터가 밖으로 나가지 못하게 합니다.
     worker-src를 따로 적지 않으면 script-src로 폴백해 서비스워커가 막힙니다. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'unsafe-inline'; worker-src 'self';
               style-src 'unsafe-inline'; connect-src 'self'; img-src 'self' data:;
               manifest-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#141413">
<title>매수신호 스크리너</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  color-scheme: dark;
  --surface-0:#141413; --surface-1:#1a1a19; --surface-2:#232322; --surface-3:#2b2b29;
  --line:#33322f;
  --text-1:#ffffff; --text-2:#c3c2b7; --text-3:#8a8980;
  /* 순차(크기) 램프 — 파랑 한 계열. 길이가 크기를 나타내므로 색은 하나로 통일 */
  --seq-200:#9ec5f4; --seq-300:#6da7ec; --seq-400:#3987e5; --seq-500:#256abf;
  /* 발산(등락) — 국내 관행: 상승 적색 / 하락 청색. ▲▼ 기호를 함께 붙여 색만으로 구분하지 않음 */
  --up:#e66767; --down:#3987e5;
  /* 상태 */
  --good:#0ca30c; --warn:#fab219;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--surface-0);color:var(--text-1);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",
       "Noto Sans KR",system-ui,sans-serif;
  padding-bottom:env(safe-area-inset-bottom);-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:0 14px 48px}

/* 헤더 */
header{position:sticky;top:0;z-index:20;background:var(--surface-0);
  padding-top:env(safe-area-inset-top);border-bottom:1px solid var(--line)}
.hrow{max-width:760px;margin:0 auto;padding:12px 14px 0;display:flex;
  align-items:baseline;justify-content:space-between;gap:8px}
h1{font-size:17px;margin:0;letter-spacing:-.2px}
.stamp{font-size:11px;color:var(--text-3);font-variant-numeric:tabular-nums}
.tabs{max-width:760px;margin:0 auto;padding:10px 14px 0;display:flex;gap:6px}
.tab{flex:1;padding:9px 0;border:1px solid var(--line);border-bottom:none;
  border-radius:10px 10px 0 0;background:transparent;color:var(--text-2);
  font:600 13.5px/1 inherit;cursor:pointer;white-space:nowrap}
/* 탭이 4개라 좁은 화면(아이폰 SE 등)에서는 글자를 한 단계 줄인다 */
@media (max-width:360px){.tabs{gap:4px;padding:10px 8px 0}.tab{font-size:12px}}
.tab[aria-selected="true"]{background:var(--surface-1);color:var(--text-1);
  border-color:var(--seq-500)}

/* 요약 타일 */
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:14px 0 10px}
.tile{background:var(--surface-1);border:1px solid var(--line);border-radius:10px;
  padding:9px 4px;text-align:center}
.tile b{display:block;font-size:19px;font-variant-numeric:tabular-nums;line-height:1.2}
.tile span{font-size:10px;color:var(--text-3)}

/* 컨트롤 */
.controls{background:var(--surface-1);border:1px solid var(--line);border-radius:12px;
  padding:11px 12px;margin-bottom:12px;display:flex;flex-direction:column;gap:10px}
.ctl-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ctl-row label{font-size:12px;color:var(--text-2);white-space:nowrap}
input[type=range]{flex:1;min-width:120px;accent-color:var(--seq-400)}
input[type=search],select{background:var(--surface-2);color:var(--text-1);
  border:1px solid var(--line);border-radius:8px;padding:7px 9px;font:14px inherit}
input[type=search]{flex:1;min-width:110px}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{padding:5px 11px;border-radius:999px;border:1px solid var(--line);
  background:transparent;color:var(--text-2);font:600 12px/1 inherit;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--surface-2);color:var(--text-1);
  border-color:var(--seq-400)}
.linkbtn{background:none;border:none;color:var(--seq-300);font:12px inherit;
  cursor:pointer;padding:0;text-decoration:underline}

/* 종목 카드 */
.card{background:var(--surface-1);border:1px solid var(--line);border-radius:12px;
  padding:12px;margin-bottom:9px;cursor:pointer;display:block;width:100%;
  text-align:left;color:inherit;font:inherit}
.card:focus-visible{outline:2px solid var(--seq-300);outline-offset:2px}
.c-top{display:flex;align-items:center;gap:9px}
.badge{flex:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;
  font:800 14px/1 inherit;color:#08131f}
.b-S{background:var(--seq-200)} .b-A{background:var(--seq-300)}
.b-B{background:var(--seq-400);color:#fff} .b-C{background:var(--seq-500);color:#fff}
.nm{flex:1;min-width:0}
.nm b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm span{font-size:11px;color:var(--text-3)}
.px{text-align:right;font-variant-numeric:tabular-nums;flex:none}
.px b{display:block;font-size:15px;font-weight:600}
.px span{font-size:12px}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--text-3)}
.head{font-size:12px;color:var(--seq-200);margin:9px 0 0}
.warnrow{display:flex;align-items:center;gap:5px;margin-top:8px;font-size:11.5px;
  color:var(--warn)}
.warnrow .dot{flex:none;width:6px;height:6px;border-radius:50%;background:var(--warn)}
.meter{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;margin:8px 0}
.meter i{display:block;height:100%;background:var(--seq-400);border-radius:0 3px 3px 0}
.mini{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;align-items:end}
.mini .bar{height:26px;background:var(--surface-2);border-radius:3px;
  display:flex;align-items:flex-end;overflow:hidden}
.mini .bar i{display:block;width:100%;background:var(--seq-400);border-radius:3px 3px 0 0}
.mini .lb{font-size:9px;color:var(--text-3);text-align:center;margin-top:3px;
  overflow:hidden;white-space:nowrap}
.mini .ok{color:var(--good);font-weight:700}
.c-foot{display:flex;justify-content:space-between;gap:8px;margin-top:9px;
  font-size:11px;color:var(--text-3);font-variant-numeric:tabular-nums}

/* 상세 */
dialog{border:none;background:var(--surface-1);color:var(--text-1);border-radius:16px;
  padding:0;width:min(600px,95vw);max-height:90vh}
dialog::backdrop{background:rgba(0,0,0,.75)}
.dh{position:sticky;top:0;z-index:2;background:var(--surface-1);padding:15px 16px 11px;
  border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.db{padding:14px 16px 24px;overflow:auto}
.close{margin-left:auto;background:var(--surface-2);border:1px solid var(--line);
  color:var(--text-2);border-radius:8px;width:30px;height:30px;font-size:16px;
  cursor:pointer;flex:none}
.sec{font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:.6px;
  margin:18px 0 8px}
.gradebox{background:var(--surface-2);border-radius:11px;padding:11px 12px;margin-bottom:4px;
  border-left:3px solid var(--seq-400)}
.gradebox b{font-size:14px} .gradebox p{margin:5px 0 0;font-size:12.5px;color:var(--text-2)}
.gradebox .cau{display:inline-block;margin-top:7px;font-size:11px;color:var(--warn);
  border:1px solid var(--warn);border-radius:6px;padding:2px 7px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.kv>div{background:var(--surface-2);border-radius:9px;padding:9px 10px}
.kv span{display:block;font-size:10.5px;color:var(--text-3)}
.kv b{font-size:14px;font-variant-numeric:tabular-nums}

/* 지표 블록 */
.ind{border:1px solid var(--line);border-radius:11px;margin-bottom:8px;overflow:hidden}
.ind-h{display:flex;align-items:center;gap:8px;padding:10px 11px;background:var(--surface-2)}
.ind-h .st{flex:none;font-size:12px;font-weight:700}
.ind-h .st.y{color:var(--good)} .ind-h .st.n{color:var(--text-3)}
.ind-h .nmz{flex:1;font-size:13.5px;font-weight:600;min-width:0}
.ind-h .sc{flex:none;font-size:12px;color:var(--text-2);font-variant-numeric:tabular-nums}
.ind-b{padding:9px 11px 11px}
.track{height:8px;background:var(--surface-3);border-radius:4px;overflow:hidden;margin-bottom:9px}
.track i{display:block;height:100%;background:var(--seq-400);border-radius:0 4px 4px 0}
.mtab{width:100%;border-collapse:collapse;font-size:12.5px;
  font-variant-numeric:tabular-nums}
.mtab td{padding:5px 0;border-bottom:1px solid var(--line);vertical-align:top}
.mtab tr:last-child td{border-bottom:none}
.mtab .mk{color:var(--text-2);width:44%}
.mtab .mv{text-align:right;font-weight:600;white-space:nowrap}
.mtab .mn{display:block;font-size:10.5px;color:var(--text-3);font-weight:400;
  text-align:right;margin-top:1px}
.dt{font-size:11.5px;color:var(--text-3);line-height:1.5;margin:9px 0 0}
.dt b{color:var(--text-2);font-weight:600}
details{margin-top:8px}
summary{font-size:11.5px;color:var(--seq-300);cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"❔ "}
details p{font-size:12px;color:var(--text-2);line-height:1.6;margin:7px 0 0;
  background:var(--surface-2);border-radius:8px;padding:9px 10px}

/* 표 보기 */
table.list{width:100%;border-collapse:collapse;font-size:12.5px;
  font-variant-numeric:tabular-nums}
table.list th,table.list td{padding:6px 5px;border-bottom:1px solid var(--line);text-align:right}
table.list th:first-child,table.list td:first-child{text-align:left}
table.list th{color:var(--text-3);font-weight:600;font-size:11px}

/* 가이드 */
.g-sec{background:var(--surface-1);border:1px solid var(--line);border-radius:12px;
  padding:14px 15px;margin-bottom:10px}
.g-sec h2{font-size:15px;margin:0 0 4px}
.g-sec .lead{font-size:12.5px;color:var(--text-3);margin:0 0 12px}
.g-sec p{font-size:13.5px;color:var(--text-2);line-height:1.7}
.g-sec ol,.g-sec ul{font-size:13.5px;color:var(--text-2);line-height:1.75;
  padding-left:20px;margin:8px 0}
.g-sec li{margin-bottom:7px}
.g-sec li b{color:var(--text-1)}
.gr{display:flex;gap:10px;align-items:flex-start;padding:11px 0;
  border-bottom:1px solid var(--line)}
.gr:last-child{border-bottom:none}
.gr .badge{width:34px;height:34px;font-size:15px}
.gr .t{flex:1;min-width:0}
.gr .t b{font-size:13.5px} .gr .t .rg{font-size:11px;color:var(--text-3);margin-left:6px}
.gr .t p{font-size:12.5px;color:var(--text-2);margin:4px 0 0;line-height:1.6}
.gr .t .cau{display:inline-block;margin-top:6px;font-size:10.5px;color:var(--warn);
  border:1px solid var(--warn);border-radius:6px;padding:2px 7px}
.wtab{width:100%;border-collapse:collapse;font-size:13px}
.wtab td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.wtab tr:last-child td{border-bottom:none}
.wtab .n{font-weight:600;width:88px}
.wtab .w{text-align:right;color:var(--text-3);font-variant-numeric:tabular-nums;width:44px}
.wtab p{margin:3px 0 0;font-size:12px;color:var(--text-3);line-height:1.6}
.warn-box{background:rgba(250,178,25,.08);border:1px solid rgba(250,178,25,.35);
  border-radius:11px;padding:12px 13px;margin-bottom:10px}
.warn-box h2{color:var(--warn);font-size:14px;margin:0 0 8px}
.warn-box li{color:var(--text-2)}
.warn-box .lead{font-size:12px;color:var(--text-3);margin:0 0 10px}
.wi{display:flex;gap:8px;padding:9px 0;border-bottom:1px solid rgba(250,178,25,.25)}
.wi:last-child{border-bottom:none}
.wi .ic{flex:none;font-size:14px;line-height:1.4}
.wi .t{flex:1;min-width:0}
.wi .t b{font-size:13px;color:var(--text-1)}
.wi .t p{margin:3px 0 0;font-size:12px;color:var(--text-2);line-height:1.55}
.wi .t .h{margin:5px 0 0;font-size:11.5px;color:var(--text-3);line-height:1.55}
.note{font-size:11px;color:var(--text-3);line-height:1.6;margin-top:18px;
  padding-top:12px;border-top:1px solid var(--line)}
.empty{text-align:center;color:var(--text-3);padding:44px 16px;font-size:14px}
a{color:var(--seq-300)}
</style>
</head>
<body>
<header>
  <div class="hrow"><h1>매수신호 스크리너</h1><span class="stamp" id="stamp">불러오는 중…</span></div>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-kr" aria-selected="true">국내주식</button>
    <button class="tab" role="tab" id="tab-us" aria-selected="false">미국주식</button>
    <button class="tab" role="tab" id="tab-coin" aria-selected="false">코인</button>
    <button class="tab" role="tab" id="tab-guide" aria-selected="false">가이드</button>
  </div>
</header>

<div class="wrap">
  <div id="screen-list">
    <div class="tiles" id="tiles"></div>

    <div class="controls">
      <div class="ctl-row">
        <label for="cut">최소 점수 <b id="cutv">65</b></label>
        <input type="range" id="cut" min="55" max="95" step="1" value="65">
      </div>
      <div class="ctl-row"><div class="chips" id="grades"></div></div>
      <div class="ctl-row">
        <input type="search" id="q" placeholder="종목명·코드 검색">
        <select id="sort">
          <option value="score">점수순</option>
          <option value="turnover">거래대금순</option>
          <option value="change">등락률순</option>
          <option value="checks">충족조건순</option>
          <option value="rr">손익비순</option>
        </select>
        <button class="linkbtn" id="viewtoggle">표로 보기</button>
      </div>
    </div>

    <div id="list"></div>
    <div id="table" hidden></div>
  </div>

  <div id="screen-guide" hidden></div>

  <p class="note">
    지표는 모두 과거 가격의 함수라 급변 구간에서는 후행합니다. 공시·실적·뉴스 등 재료는
    반영되지 않습니다. 이 화면은 후보를 좁히기 위한 필터이며 매매 권유가 아닙니다.
    최종 판단과 손절은 직접 하세요.
  </p>
</div>

<dialog id="dlg"><div id="dlgc"></div></dialog>

<script>
const GRADES=["S","A","B","C"];
const SHORT={ma:"MA",volume:"거래량",structure:"구조",rsi:"RSI",macd:"MACD",
             bb:"BB",adx:"ADX",obv:"OBV"};
const ORDER=["ma","volume","structure","rsi","macd","bb","adx","obv"];
const state={market:"kr",cut:65,grades:new Set(GRADES),q:"",sort:"score",
             view:"card",screen:"list",data:{},fetched:{},last:null,
             loading:false,stale:false};

/* 현재 보고 있는 시장의 통화 — 미국주식만 달러 표기가 된다 */
const curOf=()=>((state.data[state.market]||{}).currency)||"KRW";
const fmtP=v=>{
  if(curOf()==="USD")
    return "$"+(v>=1?v.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})
                    :v.toFixed(4));
  return v>=1000?v.toLocaleString(undefined,{maximumFractionDigits:0})
        :v>=1?v.toFixed(2):v.toFixed(4);
};
const fmtM=v=>{
  if(!v) return "-";
  if(curOf()==="USD")
    return v>=1e9?"$"+(v/1e9).toFixed(1)+"B":v>=1e6?"$"+Math.round(v/1e6)+"M"
          :"$"+Math.round(v).toLocaleString();
  return v>=1e12?(v/1e12).toFixed(1)+"조":v>=1e8?Math.round(v/1e8)+"억"
        :v>=1e4?Math.round(v/1e4)+"만":Math.round(v);
};
const cls=v=>v>0?"up":v<0?"down":"flat";
const arrow=v=>v>0?"▲":v<0?"▼":"–";
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const FRESH_MS=3*60*1000;          // 이 시간이 지나면 다시 받아온다
async function load(market){
  const hit=state.data[market];
  if(hit && Date.now()-(state.fetched[market]||0) < FRESH_MS){ state.last=hit; return hit; }
  let r;
  try{
    r=await fetch(`data/${market}_latest.json`,{cache:"no-store"});
  }catch(e){
    // 오프라인이거나 서버에 닿지 못한 경우. 예전에 받아둔 게 있으면 그걸 보여준다.
    if(hit){ state.last=hit; state.stale=true; return hit; }
    const err=new Error("network"); err.kind="network"; throw err;
  }
  if(!r.ok){
    if(hit){ state.last=hit; state.stale=true; return hit; }
    const err=new Error(`HTTP ${r.status}`); err.kind=r.status===404?"missing":"http"; throw err;
  }
  const j=await r.json();
  state.data[market]=j; state.fetched[market]=Date.now(); state.last=j; state.stale=false;
  return j;
}

function filtered(d){
  const q=state.q.trim().toLowerCase();
  const it=d.items.filter(x=>x.score>=state.cut&&state.grades.has(x.grade)
    &&(!q||x.name.toLowerCase().includes(q)||x.symbol.toLowerCase().includes(q)));
  const key={score:x=>x.score,turnover:x=>x.turnover||0,change:x=>x.change_pct,
             checks:x=>x.checks_passed*100+x.score,rr:x=>x.risk.rr}[state.sort];
  return it.sort((a,b)=>key(b)-key(a));
}

function tiles(d){
  const g=d.grade_counts||{};
  document.getElementById("tiles").innerHTML=
    GRADES.map(k=>`<div class="tile"><b>${g[k]||0}</b><span>${k}등급</span></div>`).join("")+
    `<div class="tile"><b>${(d.scanned||0).toLocaleString()}</b><span>스캔</span></div>`;
}

function chips(){
  document.getElementById("grades").innerHTML=GRADES.map(g=>
    `<button class="chip" data-g="${g}" aria-pressed="${state.grades.has(g)}">${g}등급</button>`
  ).join("");
}

function cardHTML(x){
  const byKey={}; (x.checks||[]).forEach(c=>byKey[c.key]=c);
  const mini=ORDER.map(k=>{
    const c=byKey[k]||{score:0,ok:false};
    return `<div><div class="bar" title="${esc(SHORT[k])} ${c.score}점">
      <i style="height:${Math.max(4,c.score)}%"></i></div>
      <div class="lb ${c.ok?"ok":""}">${c.ok?"✓":""}${esc(SHORT[k])}</div></div>`;
  }).join("");
  const r=x.risk;
  return `<button class="card" data-sym="${esc(x.symbol)}">
    <div class="c-top">
      <span class="badge b-${x.grade}">${x.grade}</span>
      <span class="nm"><b>${esc(x.name)}</b><span>${esc(x.symbol)} · ${esc(x.market||"")}</span></span>
      <span class="px"><b>${fmtP(x.price)}</b>
        <span class="${cls(x.change_pct)}">${arrow(x.change_pct)} ${Math.abs(x.change_pct).toFixed(2)}%</span></span>
    </div>
    ${x.headline?`<p class="head">${esc(x.headline)}</p>`:""}
    ${x.warning_count?`<div class="warnrow"><span class="dot"></span>
       매도·경계 신호 ${x.warning_count}건 — ${esc(x.warnings.map(w=>w.label).join(" · "))}</div>`:""}
    <div class="meter"><i style="width:${x.score}%"></i></div>
    <div class="mini">${mini}</div>
    <div class="c-foot">
      <span>총점 ${x.score.toFixed(1)} · 조건 ${x.checks_passed}/8${x.mtf_aligned?" · 정렬":""}</span>
      <span>손절 ${r.stop_pct.toFixed(1)}% / 목표 +${r.target_pct.toFixed(1)}% · 손익비 ${r.rr.toFixed(1)}</span>
    </div></button>`;
}

function tableHTML(items){
  return `<table class="list"><thead><tr><th>종목</th><th>등급</th><th>점수</th><th>현재가</th>
    <th>등락</th><th>조건</th><th>손익비</th><th>경고</th></tr></thead><tbody>`+
    items.map(x=>`<tr><td>${esc(x.name)}${curOf()==="USD"
      ?` <span style="color:var(--text-3)">${esc(x.symbol)}</span>`:""}</td>
    <td>${x.grade}</td><td>${x.score.toFixed(1)}</td>
    <td>${fmtP(x.price)}</td><td class="${cls(x.change_pct)}">${x.change_pct.toFixed(2)}%</td>
    <td>${x.checks_passed}/8</td><td>${x.risk.rr.toFixed(1)}</td>
    <td style="color:var(--warn)">${x.warning_count?"⚠ "+x.warning_count:"-"}</td></tr>`).join("")+
    `</tbody></table>`;
}

function render(){
  // 탭을 누른 직후에는 아직 이전 시장 데이터가 들어있다. 그대로 그리면
  // 방금 비운 목록에 이전 시장 카드가 다시 나타난다.
  if(state.loading) return;
  const d=state.data[state.market]; if(!d) return;
  tiles(d);
  const items=filtered(d);
  const list=document.getElementById("list"), tbl=document.getElementById("table");
  const cap=d.truncated?`<p class="note" style="margin-top:4px;border:none;padding:0">
      조건 충족 ${d.total_found.toLocaleString()}건 중 점수 상위 ${d.count}건만 표시합니다.</p>`:"";
  if(state.view==="table"){
    list.hidden=true; tbl.hidden=false;
    tbl.innerHTML=items.length?tableHTML(items)+cap:`<p class="empty">조건에 맞는 종목이 없습니다.</p>`;
  }else{
    tbl.hidden=true; list.hidden=false;
    list.innerHTML=items.length?items.map(cardHTML).join("")+cap
      :`<p class="empty">조건에 맞는 종목이 없습니다.<br>최소 점수를 낮춰보세요.</p>`;
  }
  const demo=d.demo?" · 샘플데이터":"";
  const stale=state.stale?" · 오프라인(저장본)":"";
  document.getElementById("stamp").textContent=
    `${d.data_date} · ${d.count}건 · ${(d.generated_at||"").slice(11,16)} 갱신${demo}${stale}`;
}

function openDetail(sym){

  const x=d.items.find(i=>i.symbol===sym); if(!x) return;
  const r=x.risk, gi=(d.grade_info||{})[x.grade]||{};
  const help=d.indicator_help||{}, cond=d.conditions||{};

  const tfs=Object.values(x.timeframes||{})
    .map(t=>`<div><span>${esc(t.label)} 점수</span><b>${t.score.toFixed(1)}</b></div>`).join("");

  const inds=ORDER.filter(k=>x.parts&&x.parts[k]).map(k=>{

  const warnBox=(x.warnings&&x.warnings.length)?`

  document.getElementById("dlgc").innerHTML=`
    <div class="dh">
      <span class="badge b-${x.grade}">${x.grade}</span>
      <span class="nm"><b style="font-size:16px">${esc(x.name)}</b>
        <span>${esc(x.symbol)} · 총점 ${x.score.toFixed(1)} · 조건 ${x.checks_passed}/8</span></span>
      <button class="close" id="cl" aria-label="닫기">✕</button>
    </div>
    <div class="db">
      <div class="gradebox">
        <b>${x.grade}등급 — ${esc(gi.title||"")}</b>
        <span style="font-size:11px;color:var(--text-3)"> ${esc(gi.range||"")}</span>
        <p>${esc(gi.body||"")}</p>
        ${gi.caution?`<span class="cau">⚠ ${esc(gi.caution)}</span>`:""}
      </div>
      ${x.headline?`<p class="head" style="margin:10px 0 0">${esc(x.headline)}</p>`:""}
      ${warnBox}

      <div class="sec">가격과 거래대금</div>
      <div class="kv">
        <div><span>현재가</span><b>${fmtP(x.price)}
          <small class="${cls(x.change_pct)}">${arrow(x.change_pct)} ${Math.abs(x.change_pct).toFixed(2)}%</small></b></div>
        <div><span>거래대금</span><b>${fmtM(x.turnover)}</b></div>

  <div class="g-sec">
    <h2>용어 사전</h2>

        60일선은 중기 흐름의 기준입니다.</li>
      <li><b>지지선 / 저항선</b> — 아래에서 받쳐주던 가격 / 위에서 막던 가격.</li>
      <li><b>돌파</b> — 저항선을 뚫고 올라가는 것.</li>
      <li><b>정배열</b> — 짧은 평균선이 긴 평균선보다 위에 차례로 놓인 상태.</li>
      <li><b>거래대금</b> — 그날 거래된 금액. 이게 작으면 원하는 가격에 못 팝니다.</li>
      <li><b>손절가</b> — 판단이 틀렸다고 인정하고 정리할 가격. 미리 정해야 지킵니다.</li>

      <li><b>ATR</b> — 하루 평균 변동폭. 크면 그만큼 출렁입니다.</li>
      <li><b>과열</b> — 짧은 기간에 많이 올라 되돌림이 나올 수 있는 상태.</li>
      <li><b>봉(캔들)</b> — 일정 기간의 시가·고가·저가·종가를 한 칸으로 그린 것.
        일봉은 하루, 주봉은 한 주입니다.</li>
    </ul>
  </div>

  <div class="g-sec">
    <h2>이 앱이 알려주지 못하는 것</h2>
    <ul>
      <li><b>재료</b> — 실적, 공시, 뉴스, 유상증자, 상장폐지 위험은 전혀 보지 않습니다.
        관심이 생긴 종목은 반드시 공시와 뉴스를 따로 확인하세요.</li>
      <li><b>미래</b> — 모든 지표는 과거 가격을 계산한 값이라 급변 구간에서는 늦습니다.</li>
      <li><b>적정 가격</b> — 이 종목이 싼지 비싼지(가치)는 판단하지 않습니다.
        차트 모양만 봅니다.</li>
      <li><b>얼마를 살지</b> — 금액과 비중은 본인의 자산 상황에 달린 문제입니다.</li>
    </ul>
    <p style="margin-top:10px;font-size:12.5px;color:var(--text-3)">
      저는 투자 전문가나 자문업자가 아니고, 이 화면은 투자 권유가 아닙니다.
      기술적 지표를 자동으로 계산해 후보를 좁혀주는 도구일 뿐입니다.
      투자 판단과 그 결과는 전적으로 본인에게 있습니다.
      큰 금액을 다루기 전에는 자격을 갖춘 전문가와 상담하세요.</p>
  </div>`;
}

/* ── 화면 전환 ─────────────────────────── */
function setScreen(s){
  state.screen=s;
  document.getElementById("screen-list").hidden=(s!=="list");
  const g=document.getElementById("screen-guide");
  g.hidden=(s!=="guide");
  if(s==="guide"){ g.innerHTML=guideHTML(); document.getElementById("stamp").textContent="가이드"; }
}

/* ── 이벤트 ───────────────────────────── */
document.getElementById("cut").addEventListener("input",e=>{
  state.cut=+e.target.value; document.getElementById("cutv").textContent=state.cut; render();});
document.getElementById("q").addEventListener("input",e=>{state.q=e.target.value;render();});
document.getElementById("sort").addEventListener("change",e=>{state.sort=e.target.value;render();});
document.getElementById("grades").addEventListener("click",e=>{
  const b=e.target.closest(".chip"); if(!b) return;
  const g=b.dataset.g;
  state.grades.has(g)?state.grades.delete(g):state.grades.add(g);
  b.setAttribute("aria-pressed",state.grades.has(g)); render();});
document.getElementById("viewtoggle").addEventListener("click",e=>{
  state.view=state.view==="card"?"table":"card";
  e.target.textContent=state.view==="card"?"표로 보기":"카드로 보기"; render();});
document.getElementById("list").addEventListener("click",e=>{
  const c=e.target.closest(".card"); if(c) openDetail(c.dataset.sym);});
document.getElementById("dlg").addEventListener("click",e=>{
  if(e.target.id==="dlg") e.target.close();});

function mark(id){
  ["tab-kr","tab-us","tab-coin","tab-guide"].forEach(t=>
    document.getElementById(t).setAttribute("aria-selected",t===id));
}

const EMPTY_MSG={
  missing:`아직 이 시장의 결과 파일이 없습니다.<br><br>
    GitHub Actions에서 해당 스크리닝을 한 번 실행하면 표시됩니다.<br>
    그 전에도 <b>가이드</b> 탭은 볼 수 있습니다.`,
  network:`지금 인터넷에 연결되어 있지 않고, 이 기기에 저장해 둔 결과도 없습니다.<br><br>
    연결된 뒤 새로고침하면 마지막 결과를 받아옵니다.`,
  http:`결과 파일을 불러오지 못했습니다. 잠시 뒤 새로고침해 주세요.`,
};

async function go(market){
  mark("tab-"+market); setScreen("list");
  state.loading=true;
  // 로딩이 끝나기 전에는 이전 시장의 카드가 남아 오해를 부르므로 비워둔다
  // (예전에는 여기서 이전 시장 카드를 눌러 상세가 터졌다).
  document.getElementById("list").innerHTML=`<p class="empty">불러오는 중…</p>`;
  document.getElementById("list").hidden=false;
  document.getElementById("table").hidden=true;
  document.getElementById("tiles").innerHTML="";
  try{
    await load(market);
    state.market=market; state.loading=false;
    render();
  }
  catch(err){
    state.market=market; state.loading=false;
    document.getElementById("list").innerHTML=
      `<p class="empty">${EMPTY_MSG[err.kind]||EMPTY_MSG.http}</p>`;
    document.getElementById("table").hidden=true;
    document.getElementById("list").hidden=false;
    document.getElementById("tiles").innerHTML="";
    document.getElementById("stamp").textContent=
